<script>
    /**
     * Client-side Logic for GCS Website
     */

    // Simple Helper to run server functions with promise support
    function runServer(funcName, ...args) {
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
            [funcName](...args);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initMobileMenu();

        // Check which page we are on based on initial template rendering
        // We can infer context from elements present
        if (document.getElementById('latest-news-grid')) {
            loadHomeNews();
        }

        if (document.getElementById('inquiryForm')) {
            initInquiryForm();
        }

        // If generic content area exists, load it
        const genericArea = document.getElementById('generic-content-area');
        if (genericArea) {
            // Parse page param from URL
            const urlParams = new URLSearchParams(window.location.search);
            const pageKey = urlParams.get('page');
            if (pageKey && pageKey !== 'contact' && pageKey !== 'admission') {
                loadGenericPage(pageKey, genericArea);
            }
        }
    });

    /**
     * Mobile Menu Toggle
     */
    function initMobileMenu() {
        const btn = document.getElementById('mobile-menu-toggle');
        const menu = document.getElementById('mobile-menu');
        if (btn && menu) {
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            });
        }
    }

    /**
     * Load News for Home Page
     */
    function loadHomeNews() {
        const container = document.getElementById('latest-news-grid');

        runServer('getNews', null, 3) // Get 3 latest items
            .then(news => {
                if (!news || news.length === 0) {
                    container.innerHTML = '<p class="text-center">등록된 소식이 없습니다.</p>';
                    return;
                }

                let html = '';
                news.forEach(item => {
                    // Fallback image
                    const imgUrl = item.image_url || 'https://via.placeholder.com/400x200?text=GCS+News';
                    const date = new Date(item.date).toLocaleDateString();

                    html += `
          <div class="card news-card">
            <div class="news-img" style="background-image: url('${imgUrl}')"></div>
            <div class="news-body">
              <div class="news-meta">
                <span>${item.category || '일반'}</span>
                <span>${date}</span>
              </div>
              <a href="#" class="news-title">${item.title}</a>
              <p>${(item.content || '').replace(/\n/g, '<br>').substring(0, 80)}...</p>
            </div>
          </div>
        `;
                });
                container.innerHTML = html;
            })
            .catch(err => {
                container.innerHTML = `<p class="error">소식을 불러오는데 실패했습니다: ${err}</p>`;
            });
    }

    /**
     * Load Generic Content
     */
    function loadGenericPage(key, container) {
        // In a real app we might fetch this via runServer
        // For now, let's assume we can fetch it via a new server function 'getPageContent'
        // I will add 'getPageContent' to Code.js and Database.js to support this.
        runServer('getPageContent', key)
            .then(data => {
                if (!data || !data.content) {
                    container.innerHTML = '<h3>준비 중입니다.</h3><p>관리자가 콘텐츠를 아직 등록하지 않았습니다.</p>';
                } else {
                    // Auto-convert newlines to <br> if the content doesn't look like raw HTML
                    let contentHtml = data.content;
                    if (!contentHtml.trim().startsWith('<')) {
                        contentHtml = contentHtml.replace(/\n/g, '<br>');
                    }
                    container.innerHTML = contentHtml;
                }
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<p>페이지를 불러올 수 없습니다.</p>';
            });
    }

    /**
     * Inquiry Form Handler
     */
    function initInquiryForm() {
        const form = document.getElementById('inquiryForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button');
            const originalText = btn.innerText;

            btn.disabled = true;
            btn.innerText = '전송 중...';

            // Collect data
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            runServer('submitInquiry', data)
                .then(res => {
                    if (res.success) {
                        alert('문의가 성공적으로 접수되었습니다! 곧 연락드리겠습니다.');
                        form.reset();
                    } else {
                        alert('오류가 발생했습니다: ' + res.message);
                    }
                })
                .catch(err => {
                    alert('서버 오류: ' + err);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                });
        });
    }
</script>
