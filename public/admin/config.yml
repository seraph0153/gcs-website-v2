backend:
  name: git-gateway
  branch: main # Branch to update (change to master if applicable)
  site_url: "https://brilliant-brigadeiros-111c19.netlify.app"

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "config"
    label: "Site Configuration"
    files:
      - label: "Main Page Layout"
        name: "main_layout"
        file: "src/content/config/main_layout.json"
        fields:
          - label: "Page Sections (Blocks)"
            name: "sections"
            widget: "list"
            types:
              - label: "Hero Slider (Carousel)"
                name: "hero"
                widget: "object"
                fields:
                  - label: "Slides"
                    name: "slides"
                    widget: "list"
                    fields:
                      - {
                          label: "Background Image",
                          name: "image",
                          widget: "image",
                        }
                      - { label: "Title", name: "title", widget: "string" }
                      - {
                          label: "Subtitle",
                          name: "subtitle",
                          widget: "string",
                        }
                      - {
                          label: "Button Text",
                          name: "button_text",
                          widget: "string",
                          required: false,
                        }
                      - {
                          label: "Button Link",
                          name: "button_link",
                          widget: "string",
                          required: false,
                        }
                      - {
                          label: "Align Text",
                          name: "align",
                          widget: "select",
                          options: ["center", "left"],
                          default: "center",
                        }
                  - {
                      label: "Auto Play Speed (seconds)",
                      name: "speed",
                      widget: "number",
                      default: 5,
                      value_type: "int",
                    }

              - label: "Features (3 Columns)"
                name: "features"
                widget: "object"
                fields:
                  - {
                      label: "Background Color",
                      name: "bg_color",
                      widget: "select",
                      options: ["white", "gray"],
                      default: "white",
                    }
                  # Currently checking if we want dynamic feature items or fixed 3 types.
                  # For simplicty/robustness, let's keep the existing structure but accessible via this block.
                  # Or better, let them edit the 3 items here.
                  - label: "Feature Items"
                    name: "items"
                    widget: "list"
                    min: 3
                    max: 3
                    fields:
                      - { label: "Title", name: "title", widget: "string" }
                      - {
                          label: "Description",
                          name: "description",
                          widget: "text",
                        }
                      - {
                          label: "Icon Name (Material Icon)",
                          name: "icon",
                          widget: "string",
                          hint: "e.g., school, menu_book, diversity_3",
                        }

              - label: "Content (Text & Image)"
                name: "content"
                widget: "object"
                fields:
                  - {
                      label: "Title",
                      name: "title",
                      widget: "string",
                      required: false,
                    }
                  - {
                      label: "Content (Markdown)",
                      name: "body",
                      widget: "markdown",
                    }
                  - {
                      label: "Image",
                      name: "image",
                      widget: "image",
                      required: false,
                    }
                  - {
                      label: "Image Position",
                      name: "image_pos",
                      widget: "select",
                      options: ["left", "right"],
                      default: "right",
                    }
                  - {
                      label: "Background Color",
                      name: "bg_color",
                      widget: "select",
                      options: ["white", "gray"],
                      default: "white",
                    }

              - label: "Latest News (Auto)"
                name: "news"
                widget: "object"
                fields:
                  - {
                      label: "Section Title",
                      name: "title",
                      widget: "string",
                      default: "School News",
                    }
                  - {
                      label: "Count",
                      name: "count",
                      widget: "number",
                      default: 3,
                      value_type: "int",
                    }
                  - {
                      label: "Background Color",
                      name: "bg_color",
                      widget: "select",
                      options: ["white", "gray"],
                      default: "white",
                    }

  - name: "news"
    label: "News & Notices"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options: ["공지사항", "학교소식", "가정통신문"],
        }
      - {
          label: "Featured Image",
          name: "thumbnail",
          widget: "image",
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Images",
          name: "images",
          widget: "list",
          field: { label: "Image", name: "image", widget: "image" },
        }
